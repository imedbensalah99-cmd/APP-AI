name: OMDA Offline Command Router
on:
  push:
    branches: [omda-freellmapi-secure-runtime-v1]
    paths:
      - 'integrations/omda-freellmapi-command-router/**'
      - 'integrations/omda-freellmapi-workflow-studio/engine.mjs'
      - 'integrations/omda-freellmapi-website-brief/engine.mjs'
      - 'integrations/omda-freellmapi-artifacts/artifact-kit.mjs'
      - 'integrations/omda-freellmapi-site-generator/**'
      - 'integrations/omda-freellmapi-email-drafts/**'
      - '.github/workflows/omda-command-router.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test integrations/omda-freellmapi-command-router/*.test.mjs
