name: OMDA FreeLLMAPI — post-deploy staging gate smoke
on:
  push:
    branches:
      - omda-freellmapi-secure-runtime-v1
    paths:
      - '.github/workflows/omda-freellmapi-post-deploy-gates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check actual staging and backup perimeter with anonymous GET only
        shell: bash
        run: |
          set -euo pipefail
          origin='https://omda-freellmapi-secure-staging-v1.onrender.com'
          backup='https://omda-freellmapi-fresh-backup-v1.imedbensalah9988.workers.dev/freeapi.db.backup'
          check() {
            local actual
            actual="$(curl --silent --show-error --retry 3 --retry-delay 5 --max-time 110 --output /dev/null --write-out '%{http_code}' "$1")"
            echo "$2 anonymous HTTP $actual (expected $3)"
            test "$actual" = "$3"
          }
          check "$origin/api/ping" 'health' 200
          check "$origin/v1/models" 'model origin gate' 403
          check "$backup" 'new backup authorization gate' 401
          echo 'PASS: public health only; private FreeLLMAPI models and encrypted backups are blocked'
