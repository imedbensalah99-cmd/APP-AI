name: One-Take AOD APK - isolated build
on:
  push:
    branches:
      - onetake-aod-apk-20261106
    paths:
      - one-take-aod/**
      - .github/workflows/one-take-aod-apk.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore checked Android source
        run: |
          mkdir -p buildinput
          base64 -d one-take-aod/project-src.tar.gz.b64 | tar -xz -C buildinput
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assemble debug APK
        working-directory: buildinput
        run: gradle --no-daemon :app:assembleDebug
      - name: Check APK and hash
        run: |
          ls -lh buildinput/app/build/outputs/apk/debug/app-debug.apk
          sha256sum buildinput/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OMDA-OneTake-v0.2-debug-APK
          path: buildinput/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
