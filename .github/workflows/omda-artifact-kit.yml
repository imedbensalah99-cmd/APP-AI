name: OMDA Safe Artifact Kit
on:
  push:
    branches: [omda-freellmapi-secure-runtime-v1]
    paths:
      - 'integrations/omda-freellmapi-artifacts/**'
      - '.github/workflows/omda-artifact-kit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline artifact security tests
        run: node --test integrations/omda-freellmapi-artifacts/artifact-kit.test.mjs
