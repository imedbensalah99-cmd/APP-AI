name: OMDA Prompt Data Guard
on:
  push:
    branches: [omda-prompt-data-guard-20261125]
    paths:
      - 'integrations/omda-freellmapi-prompt-guard/**'
      - 'integrations/omda-freellmapi-command-center/index.html'
      - '.github/workflows/omda-prompt-data-guard.yml'
  pull_request:
    paths:
      - 'integrations/omda-freellmapi-prompt-guard/**'
      - 'integrations/omda-freellmapi-command-center/index.html'
      - '.github/workflows/omda-prompt-data-guard.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check integrations/omda-freellmapi-prompt-guard/engine.mjs
      - run: node --check integrations/omda-freellmapi-prompt-guard/app.mjs
      - run: node --check integrations/omda-freellmapi-prompt-guard/cli.mjs
      - run: node --test integrations/omda-freellmapi-prompt-guard/engine.test.mjs integrations/omda-freellmapi-prompt-guard/cli.test.mjs integrations/omda-freellmapi-prompt-guard/ui-contract.test.mjs
