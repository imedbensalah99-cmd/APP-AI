name: OMDA Director — safety tests
on:
  pull_request:
    paths:
      - 'integrations/omda-director/**'
      - '.github/workflows/omda-director-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4
      - name: Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check integrations/omda-director/worker.mjs
      - name: Run director unit tests (no APIs, no secrets)
        run: node --test integrations/omda-director/worker.test.mjs
