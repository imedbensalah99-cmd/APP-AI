name: OMDA NOIR — Android debug APK
on:
  push:
    branches: [omda-noir-launcher]
    paths:
      - 'launcher/source.zip.b64'
      - '.github/workflows/build-omda-noir.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK platform using runner's command-line tools
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDK_MANAGER"
          echo "Using $SDK_MANAGER"
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack versioned launcher sources
        run: |
          mkdir -p launcher/unpacked
          base64 -d launcher/source.zip.b64 > /tmp/omda-noir-source.zip
          unzip -q /tmp/omda-noir-source.zip -d launcher/unpacked
          test -f launcher/unpacked/OMDA-NOIR-Launcher/app/build.gradle
      - name: Compile OMDA NOIR APK
        working-directory: launcher/unpacked/OMDA-NOIR-Launcher
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK signature and Android package
        run: |
          APK="launcher/unpacked/OMDA-NOIR-Launcher/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 12
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMDA-NOIR-v0.1-beta-debug-APK
          path: launcher/unpacked/OMDA-NOIR-Launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
