name: OMDA OpenMontage free-only policy verification

on:
  push:
    branches:
      - omda-openmontage-free-v1
    paths:
      - "integrations/openmontage-free/**"
      - ".github/workflows/omda-openmontage-free-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-free-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg for tiny offline media smoke test
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
      - name: Install cloud API contract dependencies
        run: python -m pip install -r integrations/openmontage-free/runner/requirements.txt
      - name: Compile documentary cloud runner source
        run: |
          python -m py_compile integrations/openmontage-free/runner/api.py
          python -m py_compile integrations/openmontage-free/renderer/documentary_render.py
          python -m py_compile integrations/openmontage-free/storage/drive_storage.py
      - name: Run zero-dependency policy tests
        run: python -m unittest discover -s integrations/openmontage-free/tests -v
      - name: Clone and guard pinned OpenMontage (NO API KEYS)
        run: python integrations/openmontage-free/install.py --destination /tmp/omda-openmontage
      - name: Check patched source compiles (NO MEDIA GENERATION)
        run: |
          python -m py_compile /tmp/omda-openmontage/tools/base_tool.py
          python -m py_compile /tmp/omda-openmontage/tools/tool_registry.py
          python -m py_compile /tmp/omda-openmontage/tools/omda_free_guard.py
      - name: Ensure paid and publish providers are blocked in real upstream classes
        run: |
          PYTHONPATH=/tmp/omda-openmontage python - <<'PY'
          from tools.omda_free_guard import allowed_tool
          from tools.video.pexels_video import PexelsVideo
          from tools.video.veo_video import VeoVideo
          good = PexelsVideo()
          bad = VeoVideo()
          assert allowed_tool(good)[0]
          assert not allowed_tool(bad)[0]
          from tools.tool_registry import ToolRegistry
          registry = ToolRegistry()
          registry.register(good)
          registry.register(bad)
          assert registry.get('pexels_video') is not None
          assert registry.get('veo_video') is None
          outcome = bad.execute({})
          assert not outcome.success
          assert outcome.error.startswith('OMDA_FREE_ONLY_BLOCKED:')
          assert outcome.cost_usd == 0
          print('PROVED: stock allowed; paid video hidden + execution blocked')
          PY

      - name: Package full patched OpenMontage source (AGPLv3 included)
        run: |
          cd /tmp/omda-openmontage
          zip -q -r /tmp/omda-openmontage-free-source.zip . -x ".git/*" -x "__pycache__/*" -x "*.pyc"
          unzip -l /tmp/omda-openmontage-free-source.zip | grep -E '(OMDA_FREE_ONLY_POLICY.md|tools/omda_free_guard.py|LICENSE)'
      - name: Upload downloadable sandbox source archive
        uses: actions/upload-artifact@v4
        with:
          name: omda-openmontage-free-source
          path: /tmp/omda-openmontage-free-source.zip
          retention-days: 30
          if-no-files-found: error
