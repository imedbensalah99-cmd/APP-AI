name: OMDA Task Planner
on:
  push:
    branches: [omda-task-planner-20261111, omda-freellmapi-secure-runtime-v1]
    paths:
      - 'server/src/services/omda-task-planner.ts'
      - 'server/src/services/omda-task-planner.test.ts'
      - 'server/src/routes/omda-tasks.ts'
      - 'server/src/routes/omda-tasks.test.ts'
      - 'server/src/app.ts'
      - 'client/src/pages/AgentsPage.tsx'
      - '.github/workflows/omda-task-planner.yml'
  pull_request:
    paths:
      - 'server/src/services/omda-task-planner.ts'
      - 'server/src/services/omda-task-planner.test.ts'
      - 'server/src/routes/omda-tasks.ts'
      - 'server/src/routes/omda-tasks.test.ts'
      - 'server/src/app.ts'
      - 'client/src/pages/AgentsPage.tsx'
      - '.github/workflows/omda-task-planner.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build server
        run: npm run build -w server
      - name: Run server tests
        run: npm test -w server
      - name: Build dashboard
        run: npm run build -w client
